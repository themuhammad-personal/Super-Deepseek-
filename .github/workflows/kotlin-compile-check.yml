name: Kotlin compile check

# TEMPORARY (verification helper, delete before merge): compiles the Android
# Kotlin sources without the full CI suite so compile errors surface in ~2 min
# instead of ~4, and can be read as check-run annotations.
on:
  push:
    branches:
      - "arena/**"

jobs:
  compile:
    name: Compile Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.android-sdk
          key: ${{ runner.os }}-android-sdk-34-build-tools-34.0.0-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Ensure Gradle wrapper files exist
        run: node scripts/ensure-gradle-wrapper.js

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Compile main and unit test Kotlin
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon compileDebugKotlin compileDebugUnitTestKotlin 2>&1 | tee /tmp/kotlin-compile.log

      - name: Surface compile errors
        if: always()
        working-directory: android
        run: |
          log=/tmp/kotlin-compile.log
          annotate() {
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
          }
          if [ -f "$log" ]; then
            grep -nE '^\s*(e|w): ' "$log" | grep '/src/main/' | head -n 22 | annotate
            grep -nE '^\s*(e|w): ' "$log" | grep '/src/test/' | head -n 22 | annotate
            grep -nE '^(FAILURE:|Caused by:)|What went wrong|Execution failed for task' "$log" \
              | head -n 10 | annotate
          fi
