name: Kotlin compile check

# TEMPORARY (verification helper, delete before merge): compiles the Android
# Kotlin sources and runs one focused JVM test class, so compile/test feedback
# arrives in ~2-3 min instead of ~5 min and can be read as check-run
# annotations (the raw job log lives on a blocked blob-storage host).
on:
  push:
    branches:
      - "arena/**"

jobs:
  compile:
    name: Compile + focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.android-sdk
          key: ${{ runner.os }}-android-sdk-34-build-tools-34.0.0-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Ensure Gradle wrapper files exist
        run: node scripts/ensure-gradle-wrapper.js

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Compile and run focused tests
        working-directory: android
        env:
          # Empty -> only compile main + unit-test sources.
          FOCUS: "com.betterdeepseek.app.RemoteDataSyncTest"
        run: |
          set -o pipefail
          if [ -n "$FOCUS" ]; then
            ./gradlew --no-daemon testDebugUnitTest --tests "$FOCUS" 2>&1 | tee /tmp/kotlin-compile.log
          else
            ./gradlew --no-daemon compileDebugKotlin compileDebugUnitTestKotlin 2>&1 | tee /tmp/kotlin-compile.log
          fi

      - name: Surface compile errors and failures
        if: always()
        working-directory: android
        run: |
          log=/tmp/kotlin-compile.log
          annotate() {
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
          }
          if [ -f "$log" ]; then
            grep -nE '^\s*(e|w): ' "$log" | grep '/src/main/' | head -n 22 | annotate
            grep -nE '^\s*(e|w): ' "$log" | grep '/src/test/' | head -n 22 | annotate
            grep -nE '^(FAILURE:|Caused by:)|What went wrong|Execution failed for task' "$log" \
              | head -n 10 | annotate
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (failure.get('message') or '').strip()
                      text = (failure.text or '').strip()
                      trace = ' | '.join(line.strip() for line in text.splitlines()
                                         if 'betterdeepseek' in line or 'AssertionError' in line)
                      detail = (msg + (' <- ' + trace if trace else '')).strip()
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {detail[:900]}")
          PY
