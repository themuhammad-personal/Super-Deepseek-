name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm run test:unit

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.android-sdk
          key: ${{ runner.os }}-android-sdk-34-build-tools-34.0.0-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser & deps
        run: npx playwright install --with-deps chromium

      - name: Ensure Gradle wrapper files exist
        run: node scripts/ensure-gradle-wrapper.js

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Android web bundle
        run: npm run build:android

      - name: Verify staged assets
        run: |
          for f in content.js content.css injected.js sandbox.js sandbox.html static/loading/1.svg; do
            test -f "android/app/src/main/assets/bds/$f" || { echo "missing asset: $f"; exit 1; }
          done
          echo "assets OK"

      - name: Run Android WebView simulator suite
        run: npm run test:e2e:android

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: Build Android APK (debug)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Android Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-android
          path: playwright-report-android
          if-no-files-found: ignore

      - name: Upload Android Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-android
          path: test-results
          if-no-files-found: ignore

      - name: Upload Android unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/app/build/test-results
          if-no-files-found: ignore
