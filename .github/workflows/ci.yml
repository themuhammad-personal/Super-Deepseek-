name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Manual trigger (e.g. `gh workflow run ci.yml --ref <branch>`) so full
  # test + APK verification can be run on any branch without a PR.
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm run test:unit

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.android-sdk
          key: ${{ runner.os }}-android-sdk-34-build-tools-34.0.0-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser & deps
        run: npx playwright install --with-deps chromium

      - name: Ensure Gradle wrapper files exist
        run: node scripts/ensure-gradle-wrapper.js

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Android web bundle
        run: npm run build:android

      - name: Verify staged assets
        run: |
          for f in content.js content.css injected.js sandbox.js sandbox.html static/loading/1.svg; do
            test -f "android/app/src/main/assets/bds/$f" || { echo "missing asset: $f"; exit 1; }
          done
          echo "assets OK"

      - name: Run Android WebView simulator suite
        run: npm run test:e2e:android

      - name: Run Kotlin unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon test 2>&1 | tee /tmp/gradle-unit-test.log

      # TEMPORARY DEBUG (remove before merge): surface Gradle/Kotlin failures as
      # check-run annotations so they can be inspected without downloading the
      # (blob-storage hosted) raw job log.
      - name: Surface Kotlin failures
        if: always()
        working-directory: android
        run: |
          log=/tmp/gradle-unit-test.log
          annotate() {
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
          }
          if [ -f "$log" ]; then
            grep -nE '^e: ' "$log" | grep '/src/main/' | head -n 22 | annotate
            grep -nE '^e: ' "$log" | grep '/src/test/' | head -n 22 | annotate
            grep -nE '^(e: |FAILURE:|Caused by:)|What went wrong|Execution failed for task' "$log" \
              | grep -v '/src/main/\|/src/test/' | head -n 8 | annotate
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (failure.get('message') or '').strip()
                      text = (failure.text or '').strip()
                      trace = ' | '.join(line.strip() for line in text.splitlines()
                                         if 'betterdeepseek' in line or 'AssertionError' in line)
                      detail = (msg + (' <- ' + trace if trace else '')).strip()
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {detail[:900]}")
          PY

      - name: Build Android APK (debug)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Android Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-android
          path: playwright-report-android
          if-no-files-found: ignore

      - name: Upload Android Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-android
          path: test-results
          if-no-files-found: ignore

      - name: Upload Android unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/app/build/test-results
          if-no-files-found: ignore
