<!DOCTYPE html>

    <style>

        box-sizing: border-box;
      }

        color: #111827;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .dc04ec1d {
        border-right: 1px solid #d1d5db;

        padding: 16px 12px;
      }

      .mock-sidebar-title {

      }

      .mock-history-list {
        margin-top: 16px;

      ._3098d02 {

      a._546d736 {
        display: flex;

        justify-content: space-between;
        gap: 12px;

      }

      ._2090548 {

    </style>
    <script>
      (() => {
        /**
         * Round-2 B.1: the fixture mimics chat.deepseek.com in more than one UI
         * language ("?lang=bn"), so locale-proof detection can be exercised end
         * to end. DeepSeek translates every native menu label; BDS must still
         * find the account popover and the chat-row menu.
         */
        const LANG = (new URLSearchParams(window.location.search).get("lang") || "en").toLowerCase();
        const TRANSLATIONS = {
          en: {
            settings: "Settings",
            report: "Report issue",
            download: "Download mobile App",
            logout: "Log out",
            rename: "Rename",
            pin: "Pin",
            share: "Share",
            remove: "Delete",
            getApp: "Get App",
            userEmail: "user@example.com",
            upload: "Upload",
            deepThink: "DeepThink",
            search: "Search",
          },
          bn: {
            settings: "সেটিংস",
            report: "সমস্যা জানান",
            download: "মোবাইল অ্যাপ ডাউনলোড করুন",
            logout: "লগ আউট",
            rename: "নাম পরিবর্তন করুন",
            pin: "পিন করুন",
            share: "শেয়ার করুন",
            remove: "মুছে ফেলুন",
            getApp: "অ্যাপটি নিন",
            userEmail: "user@example.com",
            upload: "আপলোড",
            deepThink: "ডিপ থিংক",
            search: "অনুসন্ধান",
          },
        };
        const STRINGS = TRANSLATIONS[LANG] || TRANSLATIONS.en;

        function removeMenus() {
          document.querySelectorAll(".ds-dropdown-menu").forEach((menu) => menu.remove());
        }

        function createMessageNode(role) {
          const node = document.createElement("div");
          node.className = role === "user" ? "ds-message d29f3d7d _63c77b1" : "ds-message _63c77b1";
          node.setAttribute("data-message-author-role", role);
          return node;
        }

        function createTextMessage(role, text) {
          const node = createMessageNode(role);
          const markdown = document.createElement("div");
          markdown.className = role === "user" ? "fbb737a4 ds-markdown" : "ds-markdown";
          markdown.textContent = text;
          node.appendChild(markdown);
          return node;
        }

        function createCodeMessage(language, code) {
          const node = createMessageNode("assistant");
          const markdown = document.createElement("div");
          markdown.className = "ds-markdown";

          const block = document.createElement("div");
          block.className = "md-code-block";

          const banner = document.createElement("div");
          banner.className = "md-code-block-banner";

          const languageLabel = document.createElement("span");
          languageLabel.textContent = language;

          const actions = document.createElement("div");
          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.className = "ds-atom-button";
          copyButton.innerHTML = '<span class="code-info-button-text">Copy</span>';
          actions.appendChild(copyButton);

          banner.append(languageLabel, actions);

          const pre = document.createElement("pre");
          const codeEl = document.createElement("code");
          codeEl.className = `language-${language}`;
          codeEl.textContent = code;
          pre.appendChild(codeEl);

          block.append(banner, pre);
          markdown.appendChild(block);
          node.appendChild(markdown);
          return node;
        }

        function appendMessage(node) {
          document.querySelector("#chat-messages").appendChild(node);
          return node;
        }

        function updateLastAssistantMessage(text) {
          const nodes = Array.from(document.querySelectorAll(".ds-message")).filter(
            (node) => node.getAttribute("data-message-author-role") === "assistant",
          );
          const node = nodes[nodes.length - 1];
          if (!node) return false;

          const markdown = node.querySelector(".ds-markdown");
          if (!markdown) return false;

          markdown.textContent = text;
          return true;
        }

        function getAttachedFiles() {
          const input = document.querySelector("#native-file-input");
          return Array.from(input?.files || []).map((file) => file.name);
        }

        function replaceFileInput() {
          const old = document.querySelector("#native-file-input");
          if (!old) return;
          const fresh = document.createElement("input");
          fresh.id = "native-file-input";
          fresh.type = "file";
          fresh.multiple = true;
          old.replaceWith(fresh);
        }

        function buildMenu(targetUrl) {
          removeMenus();

          const menu = document.createElement("div");
          menu.className = "ds-dropdown-menu";

          const labels = [STRINGS.rename, STRINGS.pin, STRINGS.share, STRINGS.remove];
          for (const label of labels) {
            const option = document.createElement("div");
            option.className = "ds-dropdown-menu-option";
            option.innerHTML = `
              <div class="ds-dropdown-menu-option__icon"></div>
              <div class="ds-dropdown-menu-option__label">${label}</div>
            `;
            menu.appendChild(option);
          }

          menu.dataset.targetUrl = targetUrl;
          document.body.appendChild(menu);
          return menu;
        }

        function wireHistoryMenus() {
          document.querySelectorAll("div._2090548").forEach((button) => {
            button.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              // Support both layouts: button inside <a> (old) and button as sibling (new)
              let chatLink = button.closest("a._546d736");
              if (!chatLink && button.parentElement) {
                chatLink = button.parentElement.querySelector("a._546d736");
              }
              if (!chatLink) return;
              buildMenu(chatLink.href);
            });
          });
        }

        function init() {
          let sendCount = 0;
          const sendButton = document.querySelector("#send-button");
          sendButton.addEventListener("click", () => {
            sendCount += 1;
            window.__mockDeepSeek.lastSubmittedText = document.querySelector("#chat-input").value;
          });

          document.addEventListener("click", (event) => {
            if (!event.target.closest(".ds-dropdown-menu") && !event.target.closest("div._2090548")) {
              removeMenus();
            }
          });

          wireHistoryMenus();

          // Round-2 C.1 fixture: the composer controls carry translated labels,
          // so the scanner has to recognise them structurally.
          const nativeUpload = document.querySelector(".native-attach-btn");
          if (nativeUpload) nativeUpload.textContent = STRINGS.upload;
          const deepthink = document.querySelector("#deepthink");
          if (deepthink) {
            deepthink.textContent = STRINGS.deepThink;
            deepthink.setAttribute("aria-label", STRINGS.deepThink);
          }
          const websearch = document.querySelector("#websearch");
          if (websearch) {
            websearch.textContent = STRINGS.search;
            websearch.setAttribute("aria-label", STRINGS.search);
          }

          // Round-2 D fixture: the promotion's label is translated, the store
          // link is not — BDS must hide the bar in every language.
          document
            .querySelectorAll(".mock-get-app-label")
            .forEach((node) => (node.textContent = STRINGS.getApp));

          // Settings menu: builds a real .ds-dropdown-menu on each open (same structure
          // as per-chat menus) so the hide-drawer-app-item MutationObserver fires.
          const SETTINGS_ITEMS = [
            { text: STRINGS.settings, testid: "drawer-item-settings" },
            { text: STRINGS.report, testid: "drawer-item-report" },
            { text: STRINGS.download, testid: "drawer-item-download" },
            { text: STRINGS.logout, testid: "drawer-item-logout" },
          ];

          function buildSettingsMenu() {
            document.querySelectorAll(".mock-settings-menu").forEach((m) => m.remove());
            const wrapper = document.createElement("div");
            wrapper.className = "mock-settings-menu";
            const menu = document.createElement("div");
            menu.className = "ds-dropdown-menu";
            menu.dataset.testid = "settings-drawer";

            // The signed-in user block: the language-independent anchor BDS uses
            // to recognise this popover (Round-2 B.1, tier 2).
            const userRow = document.createElement("div");
            userRow.className = "ds-dropdown-menu-option";
            userRow.dataset.testid = "drawer-item-user";
            userRow.innerHTML = `
              <img class="ds-avatar" src="https://cdn.deepseek.com/avatar/mock-user.png" alt="avatar" />
              <div class="ds-dropdown-menu-option__label">${STRINGS.userEmail}</div>
            `;
            menu.appendChild(userRow);

            for (const { text, testid } of SETTINGS_ITEMS) {
              const opt = document.createElement("div");
              opt.className = "ds-dropdown-menu-option";
              if (testid) opt.dataset.testid = testid;
              opt.innerHTML = `
                <div class="ds-dropdown-menu-option__icon"></div>
                <div class="ds-dropdown-menu-option__label">${text}</div>
              `;
              menu.appendChild(opt);
            }
            wrapper.appendChild(menu);
            document.body.appendChild(wrapper);
          }

          const settingsTrigger = document.getElementById("mock-settings-trigger");
          settingsTrigger.addEventListener("click", (event) => {
            event.stopPropagation();
            buildSettingsMenu();
          });
          document.addEventListener("click", (event) => {
            if (!event.target.closest(".mock-settings-menu") && !event.target.closest("#mock-settings-trigger")) {
              document.querySelectorAll(".mock-settings-menu").forEach((m) => m.remove());
            }
          });

          function seedMessages(count) {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
              const role = i % 2 === 0 ? "user" : "assistant";
              const node = createTextMessage(role, `Seed message ${i + 1}. `.repeat(8).trim());
              fragment.appendChild(node);
            }
            const container = document.querySelector("#chat-messages");
            container.appendChild(fragment);
            return container.querySelectorAll(".ds-message").length;
          }

          function clearMessages() {
            const container = document.querySelector("#chat-messages");
            if (container) container.replaceChildren();
          }

          // ── Observable timing helpers for #105/#108 contracts ──

          function waitForAllMessagesProcessed(expectedCount, timeoutMs) {
            const deadline = timeoutMs || 30000;
            return new Promise((resolve, reject) => {
              const start = performance.now();
              function check() {
                const msgs = document.querySelectorAll(".ds-message");
                if (msgs.length !== expectedCount) {
                  if (performance.now() - start > deadline) {
                    return reject(new Error(
                      "waitForAllMessagesProcessed timeout: expected " + expectedCount +
                      " messages, got " + msgs.length + " after " + Math.round(deadline) + "ms"
                    ));
                  }
                  requestAnimationFrame(check);
                  return;
                }
                for (let i = 0; i < msgs.length; i++) {
                  if (!msgs[i].getAttribute("data-bds-msg-id")) {
                    if (performance.now() - start > deadline) {
                      return reject(new Error(
                        "waitForAllMessagesProcessed timeout: message " + i +
                        " missing data-bds-msg-id after " + Math.round(deadline) + "ms"
                      ));
                    }
                    requestAnimationFrame(check);
                    return;
                  }
                }
                resolve(msgs.length);
              }
              check();
            });
          }

          function appendAndMeasureProcessing(text, timeoutMs) {
            const deadline = timeoutMs || 5000;
            const node = createTextMessage("assistant", text);
            // Install observer and record start time BEFORE appending so
            // append cost is included and no race exists.
            const start = performance.now();
            let observer;
            let timeoutId;
            const cleanup = () => {
              if (observer) observer.disconnect();
              if (timeoutId) clearTimeout(timeoutId);
            };
            return new Promise((resolve, reject) => {
              observer = new MutationObserver(() => {
                if (node.getAttribute("data-bds-msg-id")) {
                  cleanup();
                  resolve({ duration: performance.now() - start, id: node.getAttribute("data-bds-msg-id") });
                }
              });
              observer.observe(node, { attributes: true, attributeFilter: ["data-bds-msg-id"] });
              timeoutId = setTimeout(() => {
                cleanup();
                reject(new Error(
                  "appendAndMeasureProcessing timeout: message did not receive " +
                  "data-bds-msg-id within " + Math.round(deadline) + "ms"
                ));
              }, deadline);
              // Handle case where data-bds-msg-id is already set before observer fires
              if (node.getAttribute("data-bds-msg-id")) {
                cleanup();
                resolve({ duration: performance.now() - start, id: node.getAttribute("data-bds-msg-id") });
                return;
              }
              // Append after observer is fully set up
              appendMessage(node);
            });
          }

          window.__mockDeepSeek = {
            addAssistantMessage(text) {
              return appendMessage(createTextMessage("assistant", text));
            },
            addUserMessage(text) {
              return appendMessage(createTextMessage("user", text));
            },
            addCodeMessage(language, code) {
              return appendMessage(createCodeMessage(language, code));
            },
            updateLastAssistantMessage,
            getAttachedFiles,
            replaceFileInput,
            seedMessages,
            clearMessages,
            waitForAllMessagesProcessed,
            appendAndMeasureProcessing,
            getSendCount() {
              return sendCount;
            },
            /**
             * Round-2 C.1 fixture: simulates what DeepSeek does when the user
             * switches the UI language — it re-renders the composer action row,
             * which drops the BDS mount points React does not know about and
             * rebuilds the native toggles with translated labels. BDS has to
             * re-anchor its controls into the locked order on the next scan.
             */
            rerenderComposerForLanguage(lang) {
              const next = TRANSLATIONS[lang] || TRANSLATIONS.en;
              const row = document.querySelector("#prompt-actions");
              if (!row) return null;

              // React drops children it did not create.
              row.querySelectorAll(".bds-attach-menu-mount, .bds-deep-research-mount")
                .forEach((node) => node.remove());

              // …and rebuilds the native controls (fresh nodes, same ids).
              const nativeUpload = row.querySelector(".native-attach-btn");
              if (nativeUpload) nativeUpload.textContent = next.upload;
              const fileInput = row.querySelector("#native-file-input");
              if (fileInput) fileInput.replaceWith(fileInput.cloneNode(true));
              const deepthink = row.querySelector("#deepthink");
              if (deepthink) {
                deepthink.textContent = next.deepThink;
                deepthink.setAttribute("aria-label", next.deepThink);
              }
              const websearch = row.querySelector("#websearch");
              if (websearch) {
                websearch.textContent = next.search;
                websearch.setAttribute("aria-label", next.search);
              }
              return Array.from(row.children).length;
            },
            lastSubmittedText: "",
          };
        }

        window.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </head>
  <body>
    <!-- The sidebar account row: the only control that shows the user's avatar,
         which is what makes it recognisable without any English text. -->
    <button id="mock-settings-trigger" class="mock-settings-trigger" data-testid="settings-trigger" title="Settings" aria-haspopup="menu">
      <img class="ds-avatar" src="https://cdn.deepseek.com/avatar/mock-user.png" alt="avatar" />
      <span class="mock-account-name">User</span>
    </button>

    <div class="mock-get-app-bar" data-testid="get-app-container">
      <a class="mock-get-app-link" href="https://play.google.com/store/apps/details?id=com.deepseek.chat">
        <span aria-hidden="true">&#128241;</span>
        <span class="mock-get-app-label"></span>
      </a>
      <button type="button">
        <span aria-hidden="true">&#128241;</span>
        <span class="mock-get-app-label"></span>
      </button>
    </div>
    <div class="app-shell">
      <aside class="dc04ec1d">
        <div class="mock-sidebar-title">History</div>
        <div tabindex="0" class="mock-new-chat">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 0.599609L8 15.4" stroke="currentColor" stroke-width="1.5"></path>
            <path d="M0.600098 8H15.4001" stroke="currentColor" stroke-width="1.5"></path>
          </svg>
          <span>New Chat</span>
        </div>

        <div class="mock-history-list">
          <div class="_3098d02">
            <div class="mock-chat-item">
              <a class="_546d736" data-session-id="mock-chat-1" href="/chat/s/mock-chat-1">
                <span class="c08e6e93">Alpha Session</span>
              </a>
              <div class="_2090548" role="button" tabindex="0" aria-label="Open menu">...</div>
            </div>
            <div class="mock-chat-item">
              <a class="_546d736" data-session-id="mock-chat-2" href="/chat/s/mock-chat-2">
                <span class="c08e6e93">Beta Session</span>
              </a>
              <div class="_2090548" role="button" tabindex="0" aria-label="Open menu">...</div>
            </div>
          </div>
        </div>
      </aside>

      <main class="mock-main">
        <header class="mock-header">
          <h1>Mock DeepSeek Workspace</h1>
          <p>Fixture page used for Better DeepSeek browser-extension E2E coverage.</p>
        </header>

        <section id="chat-messages"></section>
      </main>
    </div>

    <!-- Round-2 B.6 fixture: the same shape DeepSeek uses — the editor sits in
         the composer, the icons sit in a separate action row. -->
    <section class="composer-shell">
      <div class="ds-textarea">
        <textarea id="chat-input" placeholder="Message DeepSeek"></textarea>
      </div>
      <div id="prompt-actions" class="mock-prompt-actions">
        <div class="native-attach-btn" role="button" tabindex="0">Native Upload</div>
